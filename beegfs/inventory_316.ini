[all:vars]
ansible_user=ubuntu
ansible_password='Server@123.'
ansible_become=true
ansible_become_method=sudo
ansible_become_pass='Server@123.'

[mgmtd]
172.17.1.2 node_id_name="mgmtd" mgmtd_dev="/dev/nvme1n1" mgmtd_mount="/mnt/nvme1/beegfs"

[meta]
172.17.1.1 service_id=1 node_id_name="meta-01" meta_dev="/dev/nvme0n1" meta_mount="/mnt/nvme0/beegfs"
172.17.1.2 service_id=2 node_id_name="meta-02" meta_dev="/dev/nvme0n1" meta_mount="/mnt/nvme0/beegfs"

[storage]
172.17.1.3 node_id_name="storage-03" storage_id_prefix="300" targets='[{"id": 300, "dev": "/dev/nvme0n1", "mnt": "/mnt/beegfs300"}, {"id": 301, "dev": "/dev/nvme1n1", "mnt": "/mnt/beegfs301"}]'
