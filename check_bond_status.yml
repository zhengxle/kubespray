---
- name: Check and filter abnormal Bond interfaces and NIC hardware
  hosts: kube_node
  gather_facts: no
  become: yes

  vars:
    # 定义需要检查的所有 bond 接口
    bond_interfaces:
      - bond_compute0
      - bond_compute1
      - bond_compute2
      - bond_compute3
      - bond_storage0
      - bond0

    # 要求的最低驱动版本
    min_fwpkg_ver: "235.2.97.0"
    min_l2drv_ver: "235.2.96.0"

  tasks:
    # ============================================================
    # 第一部分：Bond 接口健康检查（原有逻辑）
    # ============================================================
    - name: Execute bond health check script on remote nodes
      shell: |
        #!/bin/bash
        BONDS="{{ bond_interfaces | join(' ') }}"

        for bond in $BONDS; do
            FILE="/proc/net/bonding/$bond"

            # 1. 检查 bond 文件是否存在
            if [ ! -f "$FILE" ]; then
                echo "ABNORMAL|$bond|Bond interface does not exist"
                continue
            fi

            # 2. 提取 Bond 整体状态
            BOND_MII=$(grep "MII Status" "$FILE" | head -n 1 | awk '{print $3}')
            if [ "$BOND_MII" != "up" ]; then
                echo "ABNORMAL|$bond|Bond overall MII Status is $BOND_MII"
            fi

            # 3. 提取 LACP 状态
            LACP=$(grep "LACP active" "$FILE" | awk '{print $3}')
            if [ "$LACP" != "on" ]; then
                echo "ABNORMAL|$bond|LACP active is $LACP"
            fi

            # 4. 检查 Slave 的 Aggregator ID 是否一致
            AGG_IDS=$(grep "Aggregator ID" "$FILE" | awk '{print $3}' | sort -u)
            AGG_COUNT=$(echo "$AGG_IDS" | wc -l)
            if [ "$AGG_COUNT" -gt 1 ]; then
                echo "ABNORMAL|$bond|Inconsistent Aggregator IDs found: $(echo $AGG_IDS | tr '\n' ' ')"
            fi

            # 5. 遍历每个 Slave 网卡进行细节检查
            awk -v bond="$bond" '
                /^Slave Interface:/ {
                    if (iface != "" && iface != "none") {
                        check_slave(iface, mii, churn_a, churn_p)
                    }
                    iface = $3
                    mii = "unknown"; churn_a = "unknown"; churn_p = "unknown"
                }
                /MII Status:/ { if (iface != "") mii = $3 }
                /Actor Churn State:/ { if (iface != "") churn_a = $4 }
                /Partner Churn State:/ { if (iface != "") churn_p = $4 }
                END {
                    if (iface != "" && iface != "none") {
                        check_slave(iface, mii, churn_a, churn_p)
                    }
                }
                function check_slave(slave, mii, ca, cp) {
                    if (mii != "up") {
                        print "ABNORMAL|" bond "|Slave " slave " MII Status is " mii
                    }
                    if (ca != "none" && ca != "unknown") {
                        print "ABNORMAL|" bond "|Slave " slave " Actor Churn State is " ca
                    }
                    if (cp != "none" && cp != "unknown") {
                        print "ABNORMAL|" bond "|Slave " slave " Partner Churn State is " cp
                    }
                }
            ' "$FILE"
        done
      register: bond_check_output
      changed_when: false
      failed_when: false

    - name: Generate report of abnormal Bond interfaces
      when: "'ABNORMAL' in bond_check_output.stdout"
      debug:
        msg: "{{ bond_check_output.stdout_lines | select('search', 'ABNORMAL') | list }}"

    # ============================================================
    # 第二部分：NIC 硬件检查（新增）—— PCIe带宽 + 驱动版本
    # ============================================================
    - name: Check NIC PCIe bandwidth and driver versions
      shell: |
        #!/bin/bash
        # 版本比较函数：返回0表示 ver1 >= ver2
        version_ge() {
            local ver1="$1"
            local ver2="$2"

            # sort -V 按版本号排序，取最大值
            local max_ver
            max_ver=$(printf '%s\n%s\n' "$ver1" "$ver2" | sort -V | tail -n1)
            if [ "$max_ver" = "$ver1" ]; then
                return 0
            else
                return 1
            fi
        }

        # 检查 /usr/local/bin/bnxtdev 命令是否存在
        if [! -x /usr/local/bin/bnxtdev ]; then
            echo "ABNORMAL|/usr/local/bin/bnxtdev|Command /usr/local/bin/bnxtdev not found"
            exit 0
        fi

        # 运行 /usr/local/bin/bnxtdev 获取网卡信息
        BNXT_OUTPUT=$(/usr/local/bin/bnxtdev 2>/dev/null)

        if [ -z "$BNXT_OUTPUT" ]; then
            echo "ABNORMAL|/usr/local/bin/bnxtdev|Command /usr/local/bin/bnxtdev returned no output"
            exit 0
        fi

        # 跳过标题行，逐行解析
        # 列顺序: DEVICE_TYPE PCIE_BDF RDMA BOND NET NUMA NET_RATE PCIE_RATE MTU CARD_TYPE FWPKG_VER L2DRV_VER
        echo "$BNXT_OUTPUT" | tail -n +2 | while read -r DEVICE_TYPE PCIE_BDF RDMA BOND NET NUMA NET_RATE PCIE_RATE MTU CARD_TYPE FWPKG_VER L2DRV_VER; do

            # --- 检查 1: PCIe 带宽是否为 32.0Gx16 ---
            if [ "$PCIE_RATE" != "32.0Gx16" ]; then
                echo "ABNORMAL|/usr/local/bin/bnxtdev|PCIE $PCIE_BDF ($NET) PCIe_RATE=$PCIE_RATE (expected 32.0Gx16)"
            fi

            # --- 检查 2: FWPKG_VER 版本是否满足最低要求 ---
            if [ -n "$FWPKG_VER" ]; then
                if ! version_ge "$FWPKG_VER" "{{ min_fwpkg_ver }}"; then
                    echo "ABNORMAL|/usr/local/bin/bnxtdev|PCIE $PCIE_BDF ($NET) FWPKG_VER=$FWPKG_VER is below required {{ min_fwpkg_ver }}"
                fi
            else
                echo "ABNORMAL|/usr/local/bin/bnxtdev|PCIE $PCIE_BDF ($NET) FWPKG_VER is empty"
            fi

            # --- 检查 3: L2DRV_VER 版本是否满足最低要求 ---
            if [ -n "$L2DRV_VER" ]; then
                if ! version_ge "$L2DRV_VER" "{{ min_l2drv_ver }}"; then
                    echo "ABNORMAL|/usr/local/bin/bnxtdev|PCIE $PCIE_BDF ($NET) L2DRV_VER=$L2DRV_VER is below required {{ min_l2drv_ver }}"
                fi
            else
                echo "ABNORMAL|/usr/local/bin/bnxtdev|PCIE $PCIE_BDF ($NET) L2DRV_VER is empty"
            fi
        done
      register: bnxtdev_check_output
      changed_when: false
      failed_when: false

    - name: Generate report of abnormal NIC hardware
      when: "'ABNORMAL' in bnxtdev_check_output.stdout"
      debug:
        msg: "{{ bnxtdev_check_output.stdout_lines | select('search', 'ABNORMAL') | list }}"

    # ============================================================
    # 第三部分：汇总输出
    # ============================================================
    - name: Print success message if no abnormalities found
      when: "'ABNORMAL' not in bond_check_output.stdout and 'ABNORMAL' not in bnxtdev_check_output.stdout"
      debug:
        msg: "Host {{ inventory_hostname }}: All checked bonds and NIC hardware (PCIe bandwidth + driver versions) are healthy."
