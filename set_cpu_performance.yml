---
- name: Set CPU Governor to Performance Mode
  hosts: all
  become: true
  tasks:
    - name: Check available CPU governors
      ansible.builtin.command: cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_available_governors
      register: available_governors
      changed_when: false
      failed_when: false

    - name: Set CPU governor to performance immediately
      ansible.builtin.shell: |
        if echo "{{ available_governors.stdout | default('') }}" | grep -q performance; then
          for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            echo performance > "$f"
          done
        else
          echo "performance governor not available"
          exit 1
        fi
      changed_when: false

    - name: Create systemd service for persistent CPU performance mode
      ansible.builtin.copy:
        dest: /etc/systemd/system/cpu-performance.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Set CPU governor to performance
          After=multi-user.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/bash -c 'for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > "$f"; done'

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start CPU performance service
      ansible.builtin.systemd:
        name: cpu-performance
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify CPU governor
      ansible.builtin.shell: cat /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
      register: cpu_governor
      changed_when: false
      failed_when: false

    - name: Display CPU governor result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} CPU governors: {{ cpu_governor.stdout_lines | default([]) }}"
