---
- name: 生成 GPU 节点动态 inventory
  hosts: localhost
  gather_facts: no
  connection: local

  vars:
    csv_file: "server_sn_ip.csv"
    connect_ip_field: "Business_IP"
    # 主机名前缀，用于生成新主机名
    old_prefix: "智算节点服务器-"
    new_prefix: "gpu-node-"
    ansible_user_name: "ubuntu"
    ansible_password_value: "Server@123."

  tasks:
    - name: 读取 CSV
      read_csv:
        path: "{{ csv_file }}"
        delimiter: ","
      register: csv_data

    - name: 显示 CSV 表头（调试用）
      debug:
        msg: "列名: {{ csv_data.list[0].keys() | list }}"

    - name: 筛选智算节点服务器
      set_fact:
        gpu_hosts: >-
          {{
            csv_data.list
            | selectattr('Hostname', 'defined')
            | selectattr('Hostname', 'match', '^智算节点服务器-')
            | list
          }}

    - name: 显示找到的主机数量
      debug:
        msg: "共找到 {{ gpu_hosts | length }} 台智算节点服务器"

    - name: 生成 inventory 文件
      copy:
        dest: "generated_inventory.ini"
        content: |
          [gpu_nodes]
          {% for h in gpu_hosts %}
          {{ h.Hostname }} ansible_host={{ h.Business_IP }} ansible_user={{ ansible_user_name }} ansible_password='{{ ansible_password_value }}' ansible_become_password='{{ ansible_password_value }}' new_hostname={{ h.Hostname | regex_replace('^' + old_prefix, new_prefix) }} old_hostname={{ h.Hostname }}
          {% endfor %}
