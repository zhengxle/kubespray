[all:vars]
ansible_user=ubuntu
ansible_password='Server@123.'
ansible_become=true
ansible_become_method=sudo
ansible_become_pass='Server@123.'

[mgmtd]
172.17.0.2 node_id_name="mgmtd" mgmtd_dev="/dev/nvme1n1" mgmtd_mount="/mnt/nvme1/beegfs"

[meta]
172.17.0.1 service_id=1 node_id_name="meta-01" meta_dev="/dev/nvme0n1" meta_mount="/mnt/nvme0/beegfs"
172.17.0.2 service_id=2 node_id_name="meta-02" meta_dev="/dev/nvme0n1" meta_mount="/mnt/nvme0/beegfs"

[storage]
