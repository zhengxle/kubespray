---
- name: 1. 准备环境与清理残留进程 (Server & Client)
  hosts: "{{ target_server }}, {{ target_client }}"
  become: yes
  gather_facts: no  # 禁用 Facts 采集，提速
  vars:
    qp_val: "{{ qp | default(qps | default(8)) }}"
    duration_val: "{{ duration | default(30) }}"
  tasks:
    - name: 停止上一次残余的测试进程
      shell: |
        pkill -9 -f "ib_write_bw" || true
        pkill -9 -f "rdma_rail_bw_test.sh" || true
      failed_when: false

    - name: 确认日志目录存在
      file:
        path: /mnt/nfs_data/rdma_rail_test/rdma_rail_logs
        state: directory
        mode: '0755'

- name: 2. 启动 RDMA Server 监听
  hosts: "{{ target_server }}"
  become: yes
  gather_facts: no
  vars:
    server_node_id: "{{ inventory_hostname | regex_replace('^gpu-node-0*|^node0*', '') | int }}"
    qp_val: "{{ qp | default(qps | default(8)) }}"
    duration_val: "{{ duration | default(30) }}"
  tasks:
    - name: 后台启动 RDMA Server
      shell: |
        nohup ./rdma_rail_bw_test.sh server {{ server_node_id }} > /tmp/rdma_server.log 2>&1 &
      args:
        chdir: /mnt/nfs_data/rdma_rail_test
      environment:
        QP: "{{ qp_val }}"
        QPS: "{{ qp_val }}"
        DURATION: "{{ duration_val }}"

    - name: 等待 Server 5 个 Rail 端口监听就绪
      pause:
        seconds: 3

- name: 3. 启动 RDMA Client 压测
  hosts: "{{ target_client }}"
  become: yes
  gather_facts: no
  vars:
    client_node_id: "{{ inventory_hostname | regex_replace('^gpu-node-0*|^node0*', '') | int }}"
    server_node_id: "{{ hostvars[target_server]['inventory_hostname'] | regex_replace('^gpu-node-0*|^node0*', '') | int }}"
    qp_val: "{{ qp | default(qps | default(8)) }}"
    duration_val: "{{ duration | default(30) }}"
  tasks:
    - name: 执行 Client 并行 Rail 测试
      command: "./rdma_rail_bw_test.sh client {{ client_node_id }} {{ server_node_id }}"
      args:
        chdir: /mnt/nfs_data/rdma_rail_test
      environment:
        QP: "{{ qp_val }}"
        QPS: "{{ qp_val }}"
        DURATION: "{{ duration_val }}"
      register: test_output

    - name: 输出 Client 测试结果 summary
      debug:
        var: test_output.stdout_lines

- name: 4. 汇总生成带宽报告与硬件 Error 检查
  hosts: "{{ target_client }}"
  become: yes
  gather_facts: no
  tasks:
    - name: 运行报告生成脚本
      command: "python3 /mnt/nfs_data/rdma_rail_test/generate_report.py"
      register: report_output
      changed_when: false   # 避免每次都报 changed 状态

    - name: 打印测试汇总表格
      debug:
        var: report_output.stdout_lines

    - name: 检查博通/Mellanox 物理网口底层错帧与 Drop 计数
      shell: |
        echo "===== 原始 rdma link 输出 ====="
        rdma link
        echo "===== 开始检查物理口 ====="

        # 直接写死要检查的 Bond 接口，避免 awk 列号解析问题
        for bond_dev in bond_compute0 bond_compute1 bond_compute2 bond_compute3 bond_storage0; do
            if [ -d "/sys/class/net/$bond_dev/bonding" ]; then
                slaves=$(cat /sys/class/net/$bond_dev/bonding/slaves 2>/dev/null)
                if [ -z "$slaves" ]; then
                    echo "[$bond_dev] 无 Slave 接口"
                    continue
                fi
                for slave in $slaves; do
                    echo "--- 检查物理网卡: $slave ---"
                    # 输出所有非零的 drop/error 计数
                    ethtool -S "$slave" 2>/dev/null | grep -i -E "drop|error|crc|discard|fatal" | grep -v ": 0" || echo "    [OK] 无丢包或物理层错误"
                done
            else
                echo "[$bond_dev] 未找到 bonding 目录（可能不是 Bond 接口）"
            fi
        done
      register: phy_check
      changed_when: false

    - name: 输出 PHY 物理层健康状况
      debug:
        var: phy_check.stdout_lines

