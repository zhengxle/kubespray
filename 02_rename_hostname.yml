---
- name: 批量修改主机名
  hosts: gpu_nodes
  gather_facts: no
  become: yes
  tasks:
    - name: 设置主机名
      hostname:
        name: "{{ new_hostname }}"

    - name: 更新 /etc/hosts
      replace:
        path: /etc/hosts
        regexp: "{{ old_hostname }}"
        replace: "{{ new_hostname }}"
      ignore_errors: yes

    - name: 显示结果
      debug:
        msg: "{{ inventory_hostname }} : {{ old_hostname }} -> {{ new_hostname }}"
